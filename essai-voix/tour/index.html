<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Paco, la voix de la tour</title>
<style>
  :root { --ciel: #d6eeff; --encre: #1e2a4a; --allume: #ffd93d; --papier: #fffbf0; --vert: #1f7a45; --rouge: #b3261e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ciel); color: var(--encre); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; margin-inline: auto; padding: 14px 14px 40px; display: grid; gap: 14px; }
  .livre { background: var(--papier); border-radius: 22px; padding: 12px; display: grid; gap: 14px; box-shadow: 0 4px 14px rgba(30, 42, 74, .16); }
  .livre img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 14px; display: block; }
  .phrase { margin: 0; padding: 0 4px 6px; font-size: clamp(1.35rem, 6.2vw, 1.8rem); font-weight: 700; line-height: 1.5; text-align: center; min-height: 4.5em; }
  .mot { padding: .02em .16em; border-radius: .3em; }
  .mot.lu { background: var(--allume); }
  button { font: inherit; font-weight: 800; font-size: 1.3rem; min-height: 64px; width: 100%; border: 0; border-radius: 999px; background: #1a73e8; color: #fff; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--encre); outline-offset: 2px; }
  .bilan { background: #fff; border-radius: 14px; padding: 12px 14px; font-size: .95rem; display: grid; gap: 4px; }
  .bilan div { display: flex; justify-content: space-between; gap: 12px; }
  .ok { color: var(--vert); } .non { color: var(--rouge); }
</style>
</head>
<body>
<main>
  <section class="livre">
    <img id="image" src="p01.webp" alt="Une page de Paco le lama et la licorne">
    <p class="phrase" id="phrase"></p>
    <audio id="voix" preload="auto" src="p01.mp3"></audio>
    <button id="ecouter" type="button">Écouter tout le livre</button>
  </section>
  <section class="bilan">
    <div><span>La fenêtre</span><b id="d-fenetre"></b></div>
    <div><span>Moteur de voix du téléphone</span><b id="d-moteur"></b></div>
    <div><span>Pages jouées</span><b id="d-pages">0 sur 16</b></div>
  </section>
</main>
<script>
const PAGES = [{"page": "p01", "mots": ["Sur", "la", "montagne", "vit", "Paco,", "un", "lama", "tout", "doux", "avec", "de", "grandes", "oreilles."], "debuts": [0.05, 0.329, 0.437, 0.871, 1.025, 1.767, 1.86, 2.156, 2.326, 2.499, 2.763, 2.888, 3.199]}, {"page": "p02", "mots": ["Un", "jour,", "Paco", "voit", "passer", "une", "licorne", "qui", "brille", "de", "toutes", "les", "couleurs.", "Oh!", "Qu’elle", "est", "belle!"], "debuts": [0.05, 0.193, 0.861, 1.157, 1.341, 1.652, 1.759, 2.224, 2.363, 2.625, 2.752, 3.018, 3.145, 4.552, 5.718, 5.956, 6.05]}, {"page": "p03", "mots": ["Moi", "aussi,", "je", "veux", "être", "une", "licorne,", "se", "dit", "Paco."], "debuts": [0.05, 0.328, 0.89, 1.048, 1.2, 1.402, 1.479, 2.203, 2.405, 2.546]}, {"page": "p04", "mots": ["Il", "met", "un", "cornet", "de", "crème", "glacée", "sur", "sa", "tête.", "Ta-da!", "Une", "corne!"], "debuts": [0.05, 0.241, 0.428, 0.506, 0.881, 0.991, 1.276, 1.663, 1.837, 2.008, 3.339, 4.678, 4.915]}, {"page": "p05", "mots": ["Mais", "le", "soleil", "fait", "fondre", "la", "crème", "glacée.", "Elle", "coule", "sur", "son", "nez.", "Plic,", "ploc!"], "debuts": [0.05, 0.234, 0.337, 0.752, 0.907, 1.254, 1.365, 1.648, 3.011, 3.229, 3.483, 3.736, 3.938, 5.059, 5.788]}, {"page": "p06", "mots": ["Paco", "se", "roule", "dans", "les", "fleurs", "pour", "avoir", "de", "belles", "couleurs.", "Ta-da!"], "debuts": [0.05, 0.401, 0.557, 0.826, 0.949, 1.062, 1.514, 1.703, 2.032, 2.158, 2.38, 3.808]}, {"page": "p07", "mots": ["Les", "fleurs", "lui", "chatouillent", "le", "nez.", "Atchoum!", "Atchoum!", "Les", "pétales", "s’envolent", "partout."], "debuts": [0.05, 0.257, 0.675, 0.836, 1.263, 1.387, 2.511, 4.026, 5.556, 5.762, 6.2, 6.628]}, {"page": "p08", "mots": ["Paco", "s’assoit", "sur", "un", "rocher.", "Je", "ne", "serai", "jamais", "une", "licorne,", "soupire-t-il."], "debuts": [0.05, 0.377, 0.83, 1.064, 1.143, 2.45, 2.657, 2.751, 3.019, 3.346, 3.442, 4.15]}, {"page": "p09", "mots": ["Le", "soir", "tombe", "et", "le", "vent", "souffle.", "Tout", "à", "coup,", "la", "licorne", "arrive.", "Elle", "tremble", "de", "froid."], "debuts": [0.05, 0.239, 0.574, 0.902, 0.964, 1.089, 1.276, 2.657, 2.815, 2.955, 3.552, 3.676, 4.115, 5.513, 5.717, 6.114, 6.254]}, {"page": "p10", "mots": ["Que", "tu", "es", "chanceux,", "dit", "la", "licorne.", "Ta", "laine", "est", "si", "douce", "et", "si", "chaude!"], "debuts": [0.05, 0.202, 0.351, 0.45, 1.108, 1.283, 1.408, 2.861, 3.016, 3.237, 3.315, 3.519, 3.803, 3.882, 4.053]}, {"page": "p11", "mots": ["Paco", "ouvre", "grand", "les", "yeux.", "Chanceux,", "moi?", "Il", "n’avait", "jamais", "pensé", "à", "sa", "laine."], "debuts": [0.05, 0.475, 0.739, 1.068, 1.211, 2.394, 3.128, 4.345, 4.503, 4.781, 5.094, 5.472, 5.549, 5.704]}, {"page": "p12", "mots": ["Paco", "a", "une", "idée.", "Avec", "la", "laine", "qui", "tombe", "quand", "il", "se", "brosse,", "il", "tricote", "un", "foulard."], "debuts": [0.05, 0.457, 0.559, 0.699, 1.914, 2.21, 2.337, 2.557, 2.711, 2.975, 3.15, 3.354, 3.481, 4.124, 4.247, 4.653, 4.749]}, {"page": "p13", "mots": ["La", "licorne", "met", "le", "foulard.", "Ah,", "comme", "c’est", "chaud!", "Elle", "brille", "encore", "plus", "fort."], "debuts": [0.05, 0.254, 0.727, 0.866, 0.975, 2.478, 2.983, 3.199, 3.371, 4.59, 4.796, 5.094, 5.44, 5.598]}, {"page": "p14", "mots": ["Pour", "dire", "merci,", "elle", "souffle", "des", "étoiles", "sur", "le", "dos", "de", "Paco.", "Ta-da!"], "debuts": [0.05, 0.25, 0.483, 1.135, 1.326, 1.686, 1.809, 2.324, 2.526, 2.634, 2.806, 2.884, 4.136]}, {"page": "p15", "mots": ["Paco", "se", "regarde", "dans", "le", "lac.", "Un", "lama,", "un", "vrai!", "Il", "aime", "sa", "laine", "et", "ses", "grandes", "oreilles."], "debuts": [0.05, 0.41, 0.567, 1.055, 1.229, 1.307, 2.615, 2.727, 3.364, 3.472, 4.705, 4.876, 5.017, 5.205, 5.472, 5.549, 5.689, 6.038]}, {"page": "p16", "mots": ["Depuis", "ce", "jour,", "le", "lama", "et", "la", "licorne", "sont", "les", "meilleurs", "amis", "de", "la", "montagne."], "debuts": [0.05, 0.466, 0.608, 1.253, 1.411, 1.74, 1.803, 1.927, 2.365, 2.554, 2.662, 3.053, 3.337, 3.431, 3.543]}];
const voix = document.getElementById('voix'), image = document.getElementById('image'), phrase = document.getElementById('phrase');
const bouton = document.getElementById('ecouter');
let courante = 0, spans = [], jouees = 0;
function ecrire(id, texte, classe) { const e = document.getElementById(id); e.textContent = texte; e.className = classe || ''; }
function montrer(i) {
  const p = PAGES[i];
  image.src = p.page + '.webp';
  phrase.textContent = '';
  spans = p.mots.map((m) => { const s = document.createElement('span'); s.className = 'mot'; s.textContent = m; phrase.append(s, ' '); return s; });
}
function suivre() {
  const p = PAGES[courante];
  if (!voix.paused && !voix.ended) {
    let actif = -1;
    for (let k = 0; k < p.debuts.length; k++) if (voix.currentTime >= p.debuts[k]) actif = k;
    spans.forEach((s, k) => s.classList.toggle('lu', k === actif));
  }
  requestAnimationFrame(suivre);
}
async function jouer(i) {
  courante = i;
  montrer(i);
  if (voix.getAttribute('src') !== PAGES[i].page + '.mp3') { voix.src = PAGES[i].page + '.mp3'; voix.load(); }
  try {
    await voix.play();
    bouton.hidden = true;
  } catch (e) {
    ecrire('d-pages', 'refusé page ' + (i + 1) + ' : ' + e.name, 'non');
    bouton.hidden = false;
    bouton.textContent = 'Continuer';
    bouton.onclick = () => jouer(i);
  }
}
voix.addEventListener('ended', () => {
  jouees = Math.max(jouees, courante + 1);
  ecrire('d-pages', jouees + ' sur ' + PAGES.length, 'ok');
  spans.forEach((s) => s.classList.remove('lu'));
  if (courante + 1 < PAGES.length) { setTimeout(() => jouer(courante + 1), 450); return; }
  bouton.hidden = false;
  bouton.textContent = 'Réécouter';
  bouton.onclick = () => jouer(0);
});
voix.addEventListener('error', () => ecrire('d-pages', 'erreur du fichier, page ' + (courante + 1), 'non'));
const ua = navigator.userAgent;
const fenetre = /Instagram/i.test(ua) ? 'Instagram' : /Orca-Android|FB_IAB\/MESSENGER|FBAN\/Messenger|MessengerForiOS/i.test(ua) ? 'Messenger'
  : /FBAN|FBAV|FB_IAB|FBIOS|FB4A|\[FB/i.test(ua) ? 'Facebook' : /; wv\)/.test(ua) ? 'Fenêtre d\u2019une app' : 'Un vrai navigateur';
ecrire('d-fenetre', fenetre);
ecrire('d-moteur', 'speechSynthesis' in window ? 'présent' : 'absent', 'speechSynthesis' in window ? 'ok' : 'non');
montrer(0);
bouton.onclick = () => jouer(0);
requestAnimationFrame(suivre);
</script>
</body>
</html>
